services:
  postgres:
    image: postgres:17.1
    container_name: delivery_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: hoff
      POSTGRES_DB: delivery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    name: backend-network